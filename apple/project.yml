# property-tasks Apple app. `make project` (xcodegen) generates PropertyTasks.xcodeproj (gitignored).
# Layout and settings follow Serpentine / apple-deployment-playbook.md (phubbard/mapbook).
# One SwiftUI target with iPhone, iPad and native macOS destinations (DESIGN.md §10): not Catalyst,
# not "Designed for iPad". The model lives in the local Core package so `swift test` runs without a
# simulator.
name: PropertyTasks
options:
  bundleIdPrefix: net.phfactor
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  PropertyTasksCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Off so the scheme pre-action can read .git/ for the build number.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PropertyTasks:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PropertyTasks
    configFiles:
      Debug: PropertyTasks.xcconfig
      Release: PropertyTasks.xcconfig
    settings:
      base:
        # The bundle ID is forever (App Store identity + TCC anchor). Never change it.
        PRODUCT_BUNDLE_IDENTIFIER: net.phfactor.propertytasks
        PRODUCT_NAME: PropertyTasks
        MARKETING_VERSION: "0.1.0"
        # CURRENT_PROJECT_VERSION comes from Build.gen.xcconfig (scheme pre-action, git commit count).
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: PropertyTasks/PropertyTasks.entitlements
        ENABLE_PREVIEWS: YES
        # Maintained Info.plist: INFOPLIST_KEY_* auto-injection drops custom keys.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PropertyTasks/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: PropertyTasksCore

  PropertyTasksTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PropertyTasksTests
    configFiles:
      Debug: PropertyTasks.xcconfig
      Release: PropertyTasks.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.phfactor.propertytasksTests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen derives the iOS test-host path; the macOS bundle keeps its binary under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/PropertyTasks.app/Contents/MacOS/PropertyTasks"
    dependencies:
      - target: PropertyTasks
      - package: PropertyTasksCore

schemes:
  PropertyTasks:
    build:
      preActions:
        - name: Stamp build number from git
          settingsTarget: PropertyTasks
          script: |
            cd "$SRCROOT" || exit 0
            DATE=$(date -u +"%Y-%m-%dT%H:%MZ")
            SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
            if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
              SHA="$SHA-dirty"
            fi
            if BUILD=$(git rev-list --count HEAD 2>/dev/null); then
              if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                BUILD=$((BUILD + 1))
              fi
            else
              BUILD=1
            fi
            {
              echo "CURRENT_PROJECT_VERSION = $BUILD"
              echo "PT_BUILD_DATE = $DATE"
              echo "PT_GIT_SHA = $SHA"
            } > "$SRCROOT/Build.gen.xcconfig"
      targets:
        PropertyTasks: all
        PropertyTasksTests: [test]
    test:
      targets:
        - PropertyTasksTests
    run:
      config: Debug
    archive:
      config: Release
